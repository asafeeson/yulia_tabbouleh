version: "3.9"
services:
  db:
    image: mysql:5.7
    container_name: wordpress_db
    env_file:
      - ".env"
    volumes:
      - ./db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WP_HOST: ${WP_URL}
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: wordpress
    volumes:
      - ./wordpress:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
    ports:
      - "8000:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
    labels:
      # base setup
      - traefik.enable=true
      - traefik.http.routers.wp-secure.entrypoints=websecure
      - traefik.http.routers.wp-secure.rule=HOST(`${WP_URL}`)
      - traefik.http.routers.wp-secure.tsl=true
      - traefik.http.routers.wp-secure.certresolver=tlschallenge
      - traefik.http.services.wp-secure.loadbalancer.server.port=80
      # security
      - traefik.http.middlewares.secure-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.secure-headers.headers.sslredirect=true
      - traefik.http.middlewares.secure-headers.headers.stsseconds=31536000
      - traefik.http.middlewares.secure-headers.headers.stsincludesubdomains=true
      - traefik.http.middlewares.secure-headers.headers.stspreload=true
      - traefik.http.middlewares.secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.secure-headers.headers.browserXssFilter=true
      - traefik.http.routers.wordpress.middlewares=secure-headers
    networks:
      - traefik_network

networks:
  traefik_network:
    external: true