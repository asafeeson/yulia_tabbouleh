version: "3.3"

services:
  traefik:
    image: "traefik:v3.4"
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard (переходи по https://your-domain:8080)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./certificates/acme.json:/etc/traefik/acme.json:rw
      - ./logs:/var/log/traefik
    # user: root  # Только если у тебя проблемы с доступом к socket или логам
    labels:
      # Необязательно: Traefik сам себя не проксирует, но если хочешь дашборд через домен:
      - "traefik.enable=true"

      # HTTP → HTTPS редирект
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.middlewares=redirect-to-https"

      # Middleware: редирект
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # HTTPS Traefik dashboard (через встроенный сервис)
      - "traefik.http.routers.traefik-secure.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.traefik-secure.entrypoints=websecure"
      - "traefik.http.routers.traefik-secure.tls=true"
      - "traefik.http.routers.traefik-secure.tls.certresolver=tlschallenge"
      - "traefik.http.routers.traefik-secure.service=api@internal"
      - "traefik.http.routers.traefik-secure.middlewares=traefik-auth"

      # Безопасность: X-Forwarded-Proto
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"

    networks:
      - traefik_network

networks:
  traefik_network:
    external: true
