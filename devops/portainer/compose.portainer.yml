# docker-compose.yml (for Portainer)
version: "3.8"

services:
  portainer:
    image: portainer/portainer-ce:latest # Использовать стабильную версию, например :2.20.1
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro       # Синхронизация времени
      - /var/run/docker.sock:/var/run/docker.sock:ro # Доступ к Docker API
      - portainer_data:/data                   # Постоянное хранили-е данных Portainer
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer-secure.entrypoints=websecure"
      - "traefik.http.routers.portainer-secure.rule=Host(`${PORTAINER_HOST}`)"
      - "traefik.http.routers.portainer-secure.tls=true"
      - "traefik.http.routers.portainer-secure.tls.certresolver=tlschallenge"

      # Сервис, к которому маршрутизируется запрос (Portainer по умолчанию слушает на 9000)
      # - "traefik.http.routers.portainer-secure.service=portainer"

      # --- MIDDLEWARE ДЛЯ БЕЗОПАСНОСТИ ---
      # Если вы хотите добавить базовую аутентификацию для Portainer:
      # Создайте хешированный пароль: echo $(htpasswd -nb youruser yourpassword) | sed -e 's/\$/\$\$/g'
      # - "traefik.http.middlewares.portainer-auth.basicauth.users=youruser:$$apr1$$XXXXXXXX$$YYYYYYYYYYYYY"
      # И затем добавьте эту строку к маршрутизатору:
      # - "traefik.http.routers.portainer-secure.middlewares=portainer-auth"


      # --- SERVICE DEFINITION (для Traefik) ---
      # Traefik автоматически обнаруживает порт 9000 Portainer.
      # Если Portainer слушает на другом порту, укажите его явно:
      # - "traefik.http.services.portainer.loadbalancer.server.port=9000" # Обычно не требуется, если Portainer по умолчанию на 9000

      # --- ROUTER ДЛЯ HTTP (редирект на HTTPS) ---
      # Этот маршрутизатор перенаправляет HTTP-запросы на HTTPS
      # - "traefik.http.routers.portainer-web.entrypoints=web"
      # - "traefik.http.routers.portainer-web.rule=Host(`${PORTAINER_HOST}`)"
      # Миддлвар для редиректа на HTTPS
      # - "traefik.http.routers.portainer-web.middlewares=redirect-to-https"

      # --- MIDDLEWARE ДЛЯ HTTP -> HTTPS РЕДИРЕКТА ---
      # Определяем миддлвар для редиректа
      # - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

    networks:
      - traefik_network # Убедитесь, что это имя совпадает с внешней сетью Traefik

volumes:
  portainer_data:

networks:
  traefik_network:
    external: true
