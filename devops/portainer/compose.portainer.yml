version: "3.8"

services:
  portainer:
    image: portainer/portainer-ce:2.20.1 # фиксированная стабильная версия
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    labels:
      - "traefik.enable=true"

      # HTTPS роутер для Portainer
      - "traefik.http.routers.portainer-secure.entrypoints=websecure"
      - "traefik.http.routers.portainer-secure.rule=Host(`${PORTAINER_HOST}`)"
      - "traefik.http.routers.portainer-secure.tls=true"
      - "traefik.http.routers.portainer-secure.tls.certresolver=tlschallenge"
      - "traefik.http.routers.portainer-secure.service=portainer"

      # Явно указать порт для сервиса Portainer (обычно 9000)
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

      # Пример базовой аутентификации (раскомментируй и отредактируй если нужна)
      # - "traefik.http.middlewares.portainer-auth.basicauth.users=youruser:$$apr1$$XXXXXXXX$$YYYYYYYYYYYYY"
      # - "traefik.http.routers.portainer-secure.middlewares=portainer-auth"

    networks:
      - traefik_network

volumes:
  portainer_data:

networks:
  traefik_network:
    external: true
