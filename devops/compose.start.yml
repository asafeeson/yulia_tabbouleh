include:
  - "./traefik/compose.traefik.yml"

services:
  portainer:
    extends:
      file: "./portainer/compose.portainer.yml"
      service: portainer
    environment:
      PORTAINER_HOST: ${PORTAINER_HOST}
      PORTAINER_LOADBALANCER_PORT: ${PORTAINER_LOADBALANCER_PORT}
    labels:
      # activate traefik
      - "traefik.enable=true"
      # routers entrypoints
      - "traefik.http.routers.portainer.entrypoints=web"
      # routers rules
      - "traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST}`)"
      # middlewares
      - "traefik.http.middlewares.portainer-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.portainer.middlewares=portainer-https-redirect"
      # tls and certificates
      - "traefik.http.routers.portainer-secure.tls=true"
      - "traefik.http.routers.portainer-secure.tls.certresolver=tlschallenge"
      - "traefik.http.routers.portainer-secure.entrypoints=websecure"
      - "traefik.http.routers.portainer-secure.rule=Host(`${PORTAINER_HOST}`)"
      - "traefik.http.routers.portainer-secure.service=portainer"
      - "traefik.http.services.portainer.loadbalancer.server.port=${PORTAINER_LOADBALANCER_PORT}"
    networks:
      - traefik_network

  storefront:
    extends:
      file: "../frontend/compose.storefront.yaml"
      service: storefront
    environment:
      STOREFRONT_HOST: ${STOREFRONT_HOST}
      STOREFRONT_LOADBALANCER_PORT: ${STOREFRONT_LOADBALANCER_PORT}
    labels:
      - "traefik.enable=true"
      # routers entrypoints
      - "traefik.http.routers.storefront.entrypoints=web"
      - "traefik.http.routers.storefront-secure.entrypoints=websecure"
      # routers rules
      - "traefik.http.routers.storefront.rule=Host(`${STOREFRONT_HOST}`)"
      - "traefik.http.routers.storefront-secure.rule=Host(`${STOREFRONT_HOST}`)"
      # middlewares
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # apply middlewares to routers
      - "traefik.http.routers.storefront.middlewares=redirect-to-https"
      # tls and certificates
      - "traefik.http.routers.storefront-secure.tls=true"
      - "traefik.http.routers.storefront-secure.tls.certresolver=tlschallenge"
      # apply services to routers
      - "traefik.http.routers.storefront-secure.service=storefront"
      # services
      - "traefik.http.services.storefront.loadbalancer.server.port=${STOREFRONT_LOADBALANCER_PORT}"
    networks:
      - traefik_network

  woocommerce:
    extends:
      file: "../woocommerce/docker-compose.yaml"
      service: wordpress
    labels:
      - "traefik.enable=true"
      # routers entrypoints
      - "traefik.http.routers.woocommerce.entrypoints=web"
      - "traefik.http.routers.woocommerce-secure.entrypoints=websecure"
      # routers rules
      - "traefik.http.routers.woocommerce.rule=Host(`${WOOCOMMERCE_HOST}`)"
      - "traefik.http.routers.woocommerce-secure.rule=Host(`${WOOCOMMERCE_HOST}`)"
      # middlewares
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # apply middlewares to routers
      - "traefik.http.routers.woocommerce.middlewares=redirect-to-https"
      # tls and certificates
      - "traefik.http.routers.woocommerce-secure.tls=true"
      - "traefik.http.routers.woocommerce-secure.tls.certresolver=tlschallenge"
      # apply services to routers
      - "traefik.http.routers.woocommerce-secure.service=woocommerce"
      # services
      - "traefik.http.services.woocommerce.loadbalancer.server.port=${WOOCOMMERCE_LOADBALANCER_PORT}"
    networks:
      - traefik_network

volumes:
  portainer_data:
  redis_data:

networks:
  traefik_network:
    external: true
